<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>pdf2zh - PDF Translator</title>
    <link rel="stylesheet" href="/src/renderer/styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>pdf2zh</h1>
        <p class="subtitle">PDF Translation with Layout Detection</p>
        <div id="version-info" class="version-info">
          <span id="version-label"></span>
          <a id="update-link" href="#" class="update-badge" style="display:none;"></a>
        </div>
      </header>

      <main>
        <div id="drop-zone" class="drop-zone">
          <div class="drop-zone-content">
            <svg class="drop-icon" viewBox="0 0 24 24" width="48" height="48">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" fill="none" stroke="currentColor" stroke-width="2"/>
              <polyline points="14 2 14 8 20 8" fill="none" stroke="currentColor" stroke-width="2"/>
            </svg>
            <p>Drop PDF(s) here or <button id="browse-btn" type="button">browse</button></p>
          </div>
        </div>

        <div id="file-list" class="file-list" style="display:none;"></div>

        <div id="translate-actions" style="display:none;">
          <button id="select-pages-btn" type="button" class="btn">Select Pages</button>
          <button id="translate-btn" type="button" class="btn btn-primary">Translate</button>
        </div>

        <div id="progress-section" class="progress-section" style="display:none;">
          <div class="progress-info">
            <span id="progress-stage">Ready</span>
            <span id="progress-pages"></span>
          </div>
          <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
          </div>
          <div class="progress-actions">
            <button id="cancel-btn" type="button" class="btn btn-danger" style="display:none;">Cancel</button>
          </div>
        </div>

        <div id="output-section" class="output-section" style="display:none;">
          <p id="output-message"></p>
          <div class="output-actions">
            <button id="export-all-btn" type="button" class="btn btn-primary">Export All</button>
            <button id="open-file-btn" type="button" class="btn btn-primary">Open File</button>
            <button id="open-folder-btn" type="button" class="btn">Open Folder</button>
          </div>
        </div>
      </main>

      <aside id="settings-panel" class="settings-panel">
        <h2>Settings</h2>

        <div class="form-group">
          <label for="translator-select">Translator</label>
          <select id="translator-select">
            <option value="google">Google Translate (Free)</option>
            <option value="llm">LLM (OpenAI-compatible)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="target-lang">Target Language</label>
          <select id="target-lang">
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="zh-TW">Chinese (Traditional)</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="es">Spanish</option>
            <option value="en">English</option>
          </select>
        </div>

        <div id="llm-settings" class="llm-settings" style="display:none;">
          <div class="form-group">
            <label for="llm-provider">Provider</label>
            <select id="llm-provider">
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic</option>
              <option value="google">Google</option>
              <option value="mistral">Mistral</option>
              <option value="deepseek">DeepSeek</option>
              <option value="xai">xAI</option>
              <option value="groq">Groq</option>
              <option value="cerebras">Cerebras</option>
              <option value="openrouter">OpenRouter</option>
              <option value="zai">Z.ai</option>
              <option value="fireworks">Fireworks</option>
              <option value="huggingface">HuggingFace</option>
              <option value="custom">Custom</option>
            </select>
          </div>

          <div class="form-group">
            <label for="llm-model">Model</label>
            <select id="llm-model">
              <option value="">Select a model...</option>
            </select>
            <input type="text" id="llm-model-custom" placeholder="model-id" style="display:none;" />
          </div>

          <div class="form-group">
            <label for="llm-api-token">API Token</label>
            <div class="input-with-toggle">
              <input type="password" id="llm-api-token" placeholder="sk-..." />
              <button type="button" id="api-token-toggle" class="input-toggle-btn" aria-label="Show API token" title="Show API token">
                <svg class="icon-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-8 10-8 10 8 10 8-4 8-10 8S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icon-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c6 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.5 13.5 0 0 0 2 12s4 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
              </button>
            </div>
          </div>

          <div class="form-group" id="llm-base-url-group">
            <label for="llm-base-url">Base URL (optional)</label>
            <input type="text" id="llm-base-url" placeholder="https://api.openai.com/v1" />
          </div>

          <div class="form-group">
            <button id="test-conn-btn" type="button" class="btn btn-sm">Test Connection</button>
            <span id="test-conn-status" class="test-conn-status"></span>
          </div>

        </div>

        <button id="custom-prompt-btn" type="button" class="btn btn-sm">Custom Prompt</button>
      </aside>
    </div>

    <div id="page-select-modal" class="modal-overlay" style="display:none;">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Select Pages</h3>
          <div class="modal-header-actions">
            <button id="modal-toggle-all" type="button" class="btn btn-sm">Select All</button>
          </div>
        </div>
        <div id="modal-grid" class="modal-grid"></div>
        <div class="modal-footer">
          <button id="modal-cancel" type="button" class="btn">Cancel</button>
          <button id="modal-confirm" type="button" class="btn btn-primary">Confirm</button>
        </div>
      </div>
    </div>

    <div id="prompt-modal" class="modal-overlay" style="display:none;">
      <div class="modal-content modal-content-sm">
        <div class="modal-header">
          <h3>Custom Prompt</h3>
          <div class="modal-header-actions">
            <button id="prompt-reset-btn" type="button" class="btn btn-sm">Reset Default</button>
          </div>
        </div>
        <div class="modal-body">
          <textarea id="prompt-textarea" rows="8" placeholder="Enter custom translation prompt..."></textarea>
        </div>
        <div class="modal-footer">
          <button id="prompt-cancel-btn" type="button" class="btn">Cancel</button>
          <button id="prompt-save-btn" type="button" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>

    <div id="region-editor" class="region-editor" style="display:none;">
      <div class="editor-toolbar">
        <button id="editor-back-btn" type="button" class="btn">Back</button>
        <span id="editor-filename" class="editor-filename"></span>
        <div class="editor-toolbar-actions">
          <button id="editor-delete-btn" type="button" class="btn btn-danger" style="display:none;">Delete Region</button>
          <button id="editor-export-btn" type="button" class="btn btn-primary">Export PDF</button>
        </div>
      </div>

      <div class="editor-panels">
        <div class="editor-panel">
          <div class="editor-panel-header">Original</div>
          <div class="editor-scroll-container" id="editor-original-scroll">
          </div>
        </div>
        <div class="editor-panel">
          <div class="editor-panel-header">Translated</div>
          <div class="editor-scroll-container" id="editor-translated-scroll">
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/renderer/index.ts"></script>
  </body>
</html>
