<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>pdf2zh - Viewer</title>
    <link rel="stylesheet" href="/src/renderer/styles.css" />
  </head>
  <body>
    <div id="region-editor" class="region-editor">
      <div class="editor-toolbar">
        <button id="editor-back-btn" type="button" class="btn">Back</button>
        <span id="editor-filename" class="editor-filename"></span>
        <div class="editor-toolbar-actions">
          <button id="editor-delete-btn" type="button" class="btn btn-danger" style="display:none;">Delete Region</button>
          <button id="editor-export-btn" type="button" class="btn btn-primary">Export PDF</button>
        </div>
      </div>

      <div class="editor-panels">
        <div class="editor-panel">
          <div class="editor-panel-header">Original</div>
          <div class="editor-scroll-container" id="editor-original-scroll"></div>
        </div>
        <div class="editor-panel">
          <div class="editor-panel-header">Translated</div>
          <div class="editor-scroll-container" id="editor-translated-scroll"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/renderer/viewer.ts"></script>
  </body>
</html>
